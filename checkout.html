<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Jumia</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="site-header simple-header"><a class="brand" href="index.html">jumia<span>.</span></a>
        <div class="secure-note"><i class="fa-solid fa-lock"></i> Secure checkout</div><a href="help.html"
            class="muted-link">Need help?</a>
    </header>
    <main class="page-shell inner-page narrow">
        <div class="breadcrumbs"><a href="index.html">Home</a> / <a href="cart.html">My Cart</a> / Checkout</div>
        <h1 class="page-title">Checkout</h1>
        <form id="checkoutForm" class="checkout-layout">
            <div class="checkout-main">
                <section class="panel form-panel">
                    <h2><span class="step-number">1</span> Delivery information</h2>
                    <div class="form-grid"><label>First name<input name="firstName" required
                                placeholder="First name"></label><label>Last name<input name="lastName" required
                                placeholder="Last name"></label><label class="full">Phone number<input name="phone"
                                required type="tel" placeholder="080 0000 0000"></label><label class="full">Email
                            address<input name="email" required type="email"
                                placeholder="you@example.com"></label><label class="full">Street address<input
                                name="address" required
                                placeholder="House number and street"></label><label>State<select name="state" required>
                                <option value="">Choose state</option>
                                <option>Lagos</option>
                                <option>Abia</option>
                                <option>Abuja</option>
                                <option>Rivers</option>
                                <option>Oyo</option>
                                <option>Kano</option>
                            </select></label><label>City<input name="city" required placeholder="City"></label></div>
                </section>
                <section class="panel form-panel">
                    <h2><span class="step-number">2</span> Payment method</h2><label class="payment-option"><input
                            type="radio" name="payment" value="pay-on-delivery" checked><span><b>Pay on
                                delivery</b><small>Pay with cash or transfer when your order arrives.</small></span><i
                            class="fa-solid fa-truck"></i></label><label class="payment-option"><input type="radio"
                            name="payment" value="card"><span><b>Card payment (demo)</b><small>This case study does not
                                process real payments.</small></span><i class="fa-regular fa-credit-card"></i></label>
                </section>
            </div>
            <aside class="panel summary-panel">
                <h2>Order summary</h2>
                <div id="checkoutItems"></div>
                <div class="summary-row"><span>Subtotal</span><b id="checkoutSubtotal">₦ 0</b></div>
                <div class="summary-row"><span>Delivery fee</span><b id="deliveryFee">₦ 1,000</b></div>
                <div class="summary-row total"><span>Total</span><b id="checkoutTotal">₦ 1,000</b></div><button
                    class="btn btn-orange btn-block" type="submit">Place order <i
                        class="fa-solid fa-arrow-right"></i></button>
                <p class="muted small">Demo only — no real order or payment will be made.</p>
            </aside>
        </form>
    </main>
    <footer class="minimal-footer">© 2026 Jumia case study · <a href="help.html">Help Centre</a></footer>
    <script src="app.js"></script>
</body>

</html>
